<style>
:root {
  --bg-core: #070d17;
  --text-main: #f8fafc;
  --border-line: rgba(255, 255, 255, 0.08);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  background-color: var(--bg-core);
  color: var(--text-main);
  font-family: 'Plus Jakarta Sans', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 480px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
}

.poster-box {
  width: 100%;
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid var(--border-line);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  background: #131f33;
}

.poster-box img {
  width: 100%;
  height: auto;
  display: block;
  object-fit: cover;
}

/* Bubbling / Zoom In-Out & Glowing Animation Keyframes */
@keyframes pulseGlow {
  0% {
    transform: scale(1);
    box-shadow: 0 0 15px rgba(37, 211, 102, 0.4), 0 0 30px rgba(37, 211, 102, 0.2);
  }
  50% {
    transform: scale(1.05);
    box-shadow: 0 0 25px rgba(37, 211, 102, 0.8), 0 0 50px rgba(37, 211, 102, 0.5);
  }
  100% {
    transform: scale(1);
    box-shadow: 0 0 15px rgba(37, 211, 102, 0.4), 0 0 30px rgba(37, 211, 102, 0.2);
  }
}

.action-btn {
  width: 100%;
  background: #25D366;
  color: #fff;
  font-weight: 800;
  font-size: 16px;
  padding: 16px 24px;
  border-radius: 14px;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  /* Applying continuous pulsing/zooming and glowing animation */
  animation: pulseGlow 2s infinite ease-in-out;
  transition: transform 0.2s ease;
}

.action-btn:hover, .action-btn:active {
  transform: scale(1.08);
}

.action-btn i {
  font-size: 22px;
}
</style>

<div class="container">
  <!-- Poster Image -->
  <div class="poster-box">

  </div>

  <!-- Action Button with Zoom In/Out & Glowing Effect -->
  <a href="#" data-wa class="action-btn" target="_blank" rel="noopener">
    <i class="fa-brands fa-whatsapp"></i> Get Your ID Now
  </a>
</div>

<!-- JAVASCRIPT LOGIC -->
<script>
  const phoneNumber = "+6283861192410"; 
  const message = encodeURIComponent("Hii, I want an ID.");
  const whatsappUrl = `https://wa.me/${phoneNumber}?text=${message}`;

  document.querySelectorAll("[data-wa]").forEach(function(link) {
    link.href = whatsappUrl;
  });
</script>

</body>
